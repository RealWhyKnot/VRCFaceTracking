name: Bug report
description: Tracking is missing or wrong, a module won't load, or the app crashes.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: VRCFaceTracking version
      description: The version in the release file name you installed.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: module
    attributes:
      label: Tracking module and headset
      description: The module you use and the hardware it reads from.
      placeholder: "Virtual Desktop module, Quest Pro"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Log
      description: The lines around the problem. Remove anything you don't want public.
      render: text
    validations:
      required: false
