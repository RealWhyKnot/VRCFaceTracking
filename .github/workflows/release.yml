name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (vYYYY.M.D.N or vYYYY.M.D.N-beta)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish ${{ inputs.tag || github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          tag-pattern: '^v\d{4}\.\d+\.\d+\.\d+(-beta)?$'

      - name: Validate release version sequence
        uses: RealWhyKnot/workflows/version-sequence@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}

      - name: Script self-tests
        shell: pwsh
        run: |
          ./.github/scripts/Test-WorkflowSyntax.ps1
          ./.github/scripts/Test-ReleaseVersionSequence.ps1
          ./.github/scripts/Test-GenerateReleaseNotes.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build and test
        shell: pwsh
        run: |
          dotnet restore VRCFaceTracking.sln -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw "restore failed ($LASTEXITCODE)" }
          dotnet build VRCFaceTracking.sln -c Release -p:Platform=x64 "-p:VftBuildChannel=${{ steps.tag.outputs.channel }}" "-p:VftVersion=${{ steps.tag.outputs.version }}" --no-restore
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }
          dotnet test VRCFaceTracking.Core.Tests/VRCFaceTracking.Core.Tests.csproj -c Release -p:Platform=x64 --no-build
          if ($LASTEXITCODE -ne 0) { throw "tests failed ($LASTEXITCODE)" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "VRCFaceTracking-${{ steps.tag.outputs.version }}-win-x64"
          ./.github/scripts/Publish-App.ps1 -Channel '${{ steps.tag.outputs.channel }}' -Version '${{ steps.tag.outputs.version }}' -OutDir "build/$name"
          $zip = "build/$name.zip"
          Compress-Archive -Path "build/$name/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $integrity = "build/$name.integrity.tsv"
          $rows = @("$hash`t$((Get-Item $zip).Length)`t$name.zip")
          Get-ChildItem "build/$name" -Recurse -File | Sort-Object FullName | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path "build/$name").Path.Length + 1).Replace('\', '/')
            $rows += "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())`t$($_.Length)`t$rel"
          }
          [System.IO.File]::WriteAllLines($integrity, [string[]]$rows, (New-Object System.Text.UTF8Encoding($false)))
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "zip=$zip"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "integrity=$integrity"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$hash"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "name=$name"

      - name: Build the changelog
        id: changelog
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          title: VRCFaceTracking ${{ env.RELEASE_TAG }}

      - name: Compose the release body
        shell: pwsh
        run: |
          ./.github/scripts/Generate-ReleaseNotes.ps1 -Tag $env:RELEASE_TAG -Repo '${{ github.repository }}' -ChangelogPath '${{ steps.changelog.outputs.file }}' -ZipPath '${{ steps.package.outputs.zip }}' -IntegrityName '${{ steps.package.outputs.name }}.integrity.tsv' -OutFile build/notes.md | Out-Null
          Get-Content build/notes.md

      - name: Publish release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $extra = @()
          if ('${{ steps.tag.outputs.prerelease }}' -eq 'true') { $extra = @('--prerelease', '--latest=false') }
          gh release create $tag '${{ steps.package.outputs.zip }}' '${{ steps.package.outputs.integrity }}' --repo '${{ github.repository }}' --target '${{ steps.tag.outputs.sha }}' --title $tag --notes-file build/notes.md @extra
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }

      - name: Verify uploaded asset
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $expected = 'sha256:${{ steps.package.outputs.sha256 }}'
          $zipName = Split-Path -Leaf '${{ steps.package.outputs.zip }}'
          $ok = $false
          for ($i = 0; $i -lt 6 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            $json = gh api "repos/${{ github.repository }}/releases/tags/$tag" 2>$null
            $fetched = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            if (-not $fetched) { continue }
            $release = $json | ConvertFrom-Json
            $asset = $release.assets | Where-Object { $_.name -eq $zipName }
            if ($asset -and $asset.digest -eq $expected) { $ok = $true }
          }
          if (-not $ok) { throw "Uploaded $zipName digest does not match $expected." }
          Write-Host "Verified $zipName digest $expected"

      - name: Remove partial release on failure
        if: failure()
        shell: pwsh
        run: |
          gh release delete $env:RELEASE_TAG --repo '${{ github.repository }}' --yes 2>$null
          $global:LASTEXITCODE = 0
