name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (vYYYY.M.D.N or vYYYY.M.D.N-beta)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          tag-pattern: '^v\d{4}\.\d+\.\d+\.\d+(-beta)?$'

      - name: Validate release version sequence
        uses: RealWhyKnot/workflows/version-sequence@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}

      - name: Script self-tests
        shell: pwsh
        run: |
          ./.github/scripts/Test-WorkflowSyntax.ps1
          ./.github/scripts/Test-GenerateReleaseNotes.ps1
          ./.github/scripts/Test-GenerateContributors.ps1

  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Ensure draft release exists
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $response = gh api "repos/${{ github.repository }}/releases/tags/$tag" --include --silent 2>$null
          $global:LASTEXITCODE = 0
          $status = ([string]@($response)[0] -split ' ')[1]
          if ($status -eq '200') {
            Write-Host "Reusing published release $tag"
          } elseif ($status -ne '404') {
            throw "repos/${{ github.repository }}/releases/tags/$tag returned HTTP '$status'"
          } else {
            $drafts = @(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq ".[] | select(.tag_name==`"$tag`") | .id")
            if ($LASTEXITCODE -ne 0) { throw "gh api releases failed ($LASTEXITCODE)" }
            if ($drafts.Count -gt 0) {
              Write-Host "Reusing draft release $tag"
            } else {
              $extra = @()
              if ('${{ needs.validate.outputs.prerelease }}' -eq 'true') { $extra = @('--prerelease') }
              gh release create $tag --repo '${{ github.repository }}' --title $tag --verify-tag --draft --notes 'Build in progress.' @extra
              if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
            }
          }

      - name: Refresh contributors
        shell: pwsh
        run: ./.github/scripts/Generate-Contributors.ps1

      - name: Upload contributors
        uses: actions/upload-artifact@v7
        with:
          name: contributors
          path: VRCFaceTracking/Assets/contributors.json
          retention-days: 1

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 60
    needs: [validate, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            image: windows-latest
            rids: 'win-x64 win-arm64'
            ext: zip
          - os: linux
            image: ubuntu-latest
            rids: 'linux-x64 linux-arm64'
            ext: tar.gz
          - os: macos
            image: macos-latest
            rids: 'osx-arm64 osx-x64'
            ext: tar.gz
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download contributors
        uses: actions/download-artifact@v7
        with:
          name: contributors
          path: VRCFaceTracking/Assets

      - name: Build and test
        shell: pwsh
        run: |
          $plat = @()
          if ('${{ matrix.os }}' -eq 'windows') { $plat = @('-p:Platform=x64') }
          dotnet restore VRCFaceTracking.sln @plat
          if ($LASTEXITCODE -ne 0) { throw "restore failed ($LASTEXITCODE)" }
          dotnet build VRCFaceTracking.sln -c Release @plat "-p:VftBuildChannel=$env:RELEASE_CHANNEL" "-p:VftVersion=$env:RELEASE_VERSION" --no-restore
          if ($LASTEXITCODE -ne 0) { throw "build failed ($LASTEXITCODE)" }
          dotnet test VRCFaceTracking.Core.Tests/VRCFaceTracking.Core.Tests.csproj -c Release @plat --no-build
          if ($LASTEXITCODE -ne 0) { throw "tests failed ($LASTEXITCODE)" }
          dotnet test VRCFaceTracking.UiTests/VRCFaceTracking.UiTests.csproj -c Release @plat --no-build
          if ($LASTEXITCODE -ne 0) { throw "ui tests failed ($LASTEXITCODE)" }

      - name: Package
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          foreach ($rid in '${{ matrix.rids }}'.Split(' ')) {
            $name = "VRCFaceTracking-$version-$rid"
            $dir = "build/$name"
            ./.github/scripts/Publish-App.ps1 -Channel $env:RELEASE_CHANNEL -Version $version -Rid $rid -OutDir $dir
            if ('${{ matrix.os }}' -eq 'macos') {
              foreach ($bin in @('VRCFaceTracking', 'VRCFaceTracking.ModuleProcess')) {
                codesign --force --sign - (Join-Path $dir $bin)
                if ($LASTEXITCODE -ne 0) { throw "codesign $bin failed ($LASTEXITCODE)" }
              }
            }
            if ('${{ matrix.ext }}' -eq 'zip') {
              Compress-Archive -Path "$dir/*" -DestinationPath "build/$name.zip" -Force
            } else {
              tar -czf "build/$name.tar.gz" -C $dir .
              if ($LASTEXITCODE -ne 0) { throw "tar failed ($LASTEXITCODE)" }
            }
          }

      - name: Checksums
        uses: RealWhyKnot/workflows/checksums@v1
        with:
          archives: build/*.${{ matrix.ext }}

      - name: Upload
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $uploaded = @()
          foreach ($manifest in Get-ChildItem build -Filter '*.integrity.tsv') {
            $first = (Get-Content -LiteralPath $manifest.FullName -TotalCount 1).Split("`t")
            $archive = Join-Path build $first[2]
            gh release upload $tag $archive $manifest.FullName --repo '${{ github.repository }}' --clobber
            if ($LASTEXITCODE -ne 0) { throw "gh release upload failed ($LASTEXITCODE)" }
            $uploaded += [pscustomobject]@{ name = $first[2]; sha256 = $first[0] }
          }
          ConvertTo-Json -InputObject @($uploaded) | Set-Content -LiteralPath build/uploaded.json

      - name: Verify uploaded assets
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $uploaded = @(Get-Content -LiteralPath build/uploaded.json -Raw | ConvertFrom-Json)
          foreach ($asset in $uploaded) {
            $expected = "sha256:$($asset.sha256)"
            $ok = $false
            for ($i = 0; $i -lt 20 -and -not $ok; $i++) {
              Start-Sleep -Seconds 5
              $json = gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq ".[] | select(.tag_name==`"$tag`") | .assets" 2>$null
              $fetched = $LASTEXITCODE -eq 0
              $global:LASTEXITCODE = 0
              if (-not $fetched) { continue }
              $found = @(($json -join "`n") | ConvertFrom-Json) | Where-Object { $_.name -eq $asset.name }
              if ($found -and $found.digest -eq $expected) { $ok = $true }
            }
            if (-not $ok) { throw "Uploaded $($asset.name) digest does not match $expected." }
            Write-Host "Verified $($asset.name) digest $expected"
          }

  smoke:
    name: Smoke ${{ matrix.os }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 15
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            image: ubuntu-latest
          - os: windows
            image: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - name: Install display dependencies
        if: matrix.os == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libice6 libsm6

      - name: Launch check linux-x64
        if: matrix.os == 'linux'
        shell: bash
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq ".[] | select(.tag_name==\"$RELEASE_TAG\") | .assets[] | select(.name | endswith(\"-linux-x64.tar.gz\")) | .id")
          if [ -z "$id" ]; then
            echo "No linux-x64 archive on $RELEASE_TAG"
            exit 1
          fi
          mkdir -p smoke/app
          gh api "repos/${{ github.repository }}/releases/assets/$id" -H "Accept: application/octet-stream" > smoke/app.tar.gz
          tar -xzf smoke/app.tar.gz -C smoke/app
          chmod +x smoke/app/VRCFaceTracking
          (cd smoke/app && xvfb-run -a timeout 60 ./VRCFaceTracking) &
          markers=("channel=$RELEASE_CHANNEL")
          if [ "$RELEASE_CHANNEL" != release ]; then
            markers+=("Initializing OSC")
          fi
          found=
          for i in $(seq 1 60); do
            sleep 1
            found=1
            for marker in "${markers[@]}"; do
              if ! grep -rlq "$marker" "$HOME/.local/share/VRCFaceTracking/logs" 2>/dev/null; then
                found=
                break
              fi
            done
            if [ -n "$found" ]; then
              break
            fi
          done
          pkill -f VRCFaceTracking || true
          if [ -z "$found" ]; then
            echo "No log under ~/.local/share/VRCFaceTracking/logs contained ${markers[*]} within 60s"
            ls -la "$HOME/.local/share/VRCFaceTracking/logs" 2>/dev/null || true
            exit 1
          fi
          echo "App startup logged ${markers[*]}"

      - name: Launch check win-x64
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $json = gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq ".[] | select(.tag_name==`"$tag`") | .assets"
          if ($LASTEXITCODE -ne 0) { throw "gh api releases failed ($LASTEXITCODE)" }
          $asset = @(($json -join "`n") | ConvertFrom-Json) | Where-Object { $_.name -like '*-win-x64.zip' } | Select-Object -First 1
          if (-not $asset) { throw "No win-x64 archive on $tag" }
          New-Item -ItemType Directory -Force smoke | Out-Null
          $zip = Join-Path 'smoke' $asset.name
          $download = Start-Process -FilePath gh -ArgumentList @('api', "repos/${{ github.repository }}/releases/assets/$($asset.id)", '-H', '"Accept: application/octet-stream"') -RedirectStandardOutput $zip -NoNewWindow -Wait -PassThru
          if ($download.ExitCode -ne 0) { throw "gh api asset download failed ($($download.ExitCode))" }
          Expand-Archive -LiteralPath $zip -DestinationPath smoke/app -Force
          $app = (Resolve-Path smoke/app).Path
          $logs = Join-Path $env:LOCALAPPDATA 'VRCFaceTracking/logs'
          Start-Process -FilePath (Join-Path $app 'VRCFaceTracking.exe') -WorkingDirectory $app | Out-Null
          $markers = @("channel=$env:RELEASE_CHANNEL")
          if ($env:RELEASE_CHANNEL -ne 'release') { $markers += 'Initializing OSC' }
          $found = $false
          for ($i = 0; $i -lt 60 -and -not $found; $i++) {
            Start-Sleep -Seconds 1
            if (Test-Path -LiteralPath $logs) {
              $text = (Get-ChildItem -LiteralPath $logs -File -Recurse | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw -ErrorAction SilentlyContinue }) -join "`n"
              $found = @($markers | Where-Object { $text -notmatch [regex]::Escape($_) }).Count -eq 0
            }
          }
          Get-Process -Name VRCFaceTracking, VRCFaceTracking.ModuleProcess -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $found) {
            if (Test-Path -LiteralPath $logs) { Get-ChildItem -LiteralPath $logs -Recurse | Out-String | Write-Host }
            throw "No log under $logs contained $($markers -join ', ') within 60s"
          }
          Write-Host "App startup logged $($markers -join ', ')"

  notes:
    name: Release notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, build, smoke]
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.tag }}

      - name: Resolve the changelog base
        id: base
        shell: bash
        run: |
          case "$RELEASE_TAG" in
            *-*) previous=$(git describe --tags --abbrev=0 "$RELEASE_TAG^" 2>/dev/null || true) ;;
            *) previous=$(git describe --tags --abbrev=0 --exclude '*-*' "$RELEASE_TAG^" 2>/dev/null || true) ;;
          esac
          if [ -z "$previous" ]; then
            previous=$(tr -d '[:space:]' < .github/release-base)
          fi
          echo "Changelog base: $previous"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      - name: Build the changelog
        id: changelog
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          previous-tag: ${{ steps.base.outputs.previous }}
          title: VRCFaceTracking ${{ env.RELEASE_TAG }}

      - name: Download integrity manifests
        shell: bash
        run: |
          mkdir -p assets
          gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq ".[] | select(.tag_name==\"$RELEASE_TAG\") | .assets[] | select(.name | endswith(\".integrity.tsv\")) | \"\(.id) \(.name)\"" > manifests.txt
          if [ ! -s manifests.txt ]; then
            echo "Release $RELEASE_TAG has no integrity manifests"
            exit 1
          fi
          while read -r id name; do
            gh api "repos/${{ github.repository }}/releases/assets/$id" -H "Accept: application/octet-stream" > "assets/$name"
          done < manifests.txt
          head -n 1 -v assets/*.integrity.tsv

      - name: Compose the release body
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          ./.github/scripts/Generate-ReleaseNotes.ps1 -Tag $env:RELEASE_TAG -Repo '${{ github.repository }}' -ChangelogPath '${{ steps.changelog.outputs.file }}' -AssetsDir assets -OutFile build/notes.md | Out-Null
          Get-Content build/notes.md

      - name: Publish notes
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ needs.validate.outputs.prerelease }}' -eq 'true') { $extra = @('--prerelease', '--latest=false') }
          gh release edit $env:RELEASE_TAG --repo '${{ github.repository }}' --notes-file build/notes.md --verify-tag --draft=false @extra
          if ($LASTEXITCODE -ne 0) { throw "gh release edit failed ($LASTEXITCODE)" }
