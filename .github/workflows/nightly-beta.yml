name: Nightly beta

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    permissions:
      contents: write
      actions: read
    uses: RealWhyKnot/workflows/.github/workflows/nightly-beta.yml@v1
    with:
      ci-workflow: ci.yml
      ignore-paths: |
        VRCFaceTracking.Core.Tests/**
        .vsconfig

  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
